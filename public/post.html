<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRUD - Cadastrar (POST)</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/">Listar (GET)</a>
        <a href="/post">Cadastrar (POST)</a>
        <a href="/put">Atualizar (PUT)</a>
        <a href="/delete">Deletar (DELETE)</a>
    </nav>
    <h1>Cadastrar Novo Registro (POST)</h1>
    <form id="post-form">
        <div><label>Nome:</label><input type="text" id="nome"></div>
        <div><label>Sobrenome:</label><input type="text" id="sobrenome"></div>
        <div><label>Email:</label><input type="email" id="email"></div>
        <div><label>Idade:</label><input type="number" id="idade"></div>
        <div><label>Telefone:</label><input type="text" id="telefone"></div>
        <div><label>Rua:</label><input type="text" id="rua"></div>
        <div><label>Bairro:</label><input type="text" id="bairro"></div>
        <div><label>Cidade:</label><input type="text" id="cidade"></div>
        <div><label>Estado:</label><input type="text" id="estado" maxlength="2"></div>
        <div><label>RG:</label><input type="text" id="rg"></div>
        <input type="button" onclick="enviarDados()" value="Enviar Cadastro">
    </form>
    <script src="/post/script.js"></script>
</body>
</html>
